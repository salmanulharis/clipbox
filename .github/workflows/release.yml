name: Release

# Push a tag like v1.5.0 to publish a GitHub Release. The notes are that version's
# CHANGELOG.md section; GitHub attaches the source code automatically. No secrets needed.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    name: Publish ${{ github.ref_name }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Check the version matches the tag
        run: |
          V="${GITHUB_REF_NAME#v}"
          grep -q "\"version\": \"$V\"" package.json || { echo "package.json version != $V"; exit 1; }
          grep -q "^## \[$V\]" CHANGELOG.md || { echo "CHANGELOG.md has no [$V] section"; exit 1; }

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test

      - name: Release notes
        run: |
          V="${GITHUB_REF_NAME#v}"
          awk -v h="## [$V]" 'index($0, h) == 1 {on=1; next} on && index($0, "## [") == 1 {exit} on {print}' CHANGELOG.md > notes.md
          {
            echo
            echo "### Install"
            echo "Download the source below, then \`npm install && npm start\` (see the README)."
          } >> notes.md

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "ClipBox ${GITHUB_REF_NAME#v}" --notes-file notes.md --verify-tag
